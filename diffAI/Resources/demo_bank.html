<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Bank Sign In (fake bank for testing)</title>
  <style>
    body { font-family: -apple-system, sans-serif; font-size: 20px; margin: 0; padding: 16px; color: #111; }
    label { display: block; margin-top: 16px; font-weight: 600; }
    input { font-size: 20px; padding: 10px; width: 100%; box-sizing: border-box; }
    button { font-size: 22px; padding: 14px 20px; margin-top: 20px; }
  </style>
</head>
<body>
  <h1>Demo Bank</h1>
  <p>This is a fake bank page for testing. Do not enter real details.</p>
  <form aria-label="Sign in">
    <label for="user">User name</label>
    <input id="user" name="username" type="text" autocomplete="username">
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
